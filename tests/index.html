<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PyLens tests</title>
<style>
  body{font:14px/1.5 system-ui,sans-serif;margin:20px;background:#0f1117;color:#e6e8ee}
  h1{font-size:20px;margin:0 0 4px}
  h2{font-size:15px;margin:22px 0 8px}
  #summary{padding:8px 12px;border-radius:8px;background:#1d212c;display:inline-block;margin:6px 0}
  .pass{color:#4ade80}.fail{color:#f87171}
  table{border-collapse:collapse;width:100%;max-width:900px}
  td{border-bottom:1px solid #2a2f3d;padding:4px 8px;vertical-align:top}
  td.n{width:42%}
  .msg{color:#8a91a5;font-size:12.5px}
  #frames{position:absolute;left:-12000px;top:0}
</style>
</head>
<body>
<h1>PyLens tests</h1>
<div id="summary">running...</div>
<label><input type="checkbox" id="slow"> include slow tests (matplotlib)</label>
<h2>Tracer cases</h2>
<table id="cases"></table>
<h2>Layout checks</h2>
<table id="layout"></table>
<div id="frames"></div>

<script src="../vendor/config.js"></script>
<script src="../js/tracer.js"></script>
<script src="../js/worker.js"></script>
<script src="cases.js"></script>
<script src="layout.js"></script>
<script>
const $ = id => document.getElementById(id);
const V = window.PYLENS_VENDOR || null;
const PYODIDE_BASE = V ? new URL('../' + V.pyodide, location.href).href : 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
const WHEELS = V ? (V.wheels || []).map(x=>new URL('../' + x, location.href).href) : [];

let worker, pending = null, runId = 0;
const rpcWait = new Map();
function rpcCall(type, payload){
  return new Promise(res=>{ const id = ++runId; rpcWait.set(id, res); worker.postMessage(Object.assign({type:type, id:id}, payload)); });
}
function startWorker(){
  return new Promise((resolve, reject)=>{
    const src = '(' + workerMain.toString() + ')(' + JSON.stringify(PY) + ',' + JSON.stringify(PYODIDE_BASE) + ',' + JSON.stringify(WHEELS) + ')';
    worker = new Worker(URL.createObjectURL(new Blob([src], {type:'text/javascript'})));
    worker.onmessage = ev=>{
      const m = ev.data;
      if(typeof m === 'string') return;
      if(m.type === 'ready') resolve();
      else if(m.type === 'initfail') reject(new Error(m.error));
      else if(m.type === 'rpc' && rpcWait.has(m.id)){ const r = rpcWait.get(m.id); rpcWait.delete(m.id); r(m); }
      else if(m.type === 'result' && pending && pending.id === m.id){ const p = pending; pending = null; p.resolve(JSON.parse(m.data)); }
      else if(m.type === 'fail' && pending && pending.id === m.id){ const p = pending; pending = null; p.reject(new Error(m.error)); }
    };
  });
}
function runPy(c){
  return new Promise((resolve, reject)=>{
    const id = ++runId; pending = {id, resolve, reject};
    worker.postMessage({type:'run', id:id, code:c.code, stdin:c.stdin || '', max:c.max || 2000, files:c.files || []});
  });
}

function mkT(){
  const checks = [];
  return {
    checks,
    ok(cond, msg){ checks.push([!!cond, msg]); },
    eq(a, b, msg){ const ok = JSON.stringify(a) === JSON.stringify(b); checks.push([ok, ok ? msg : msg + ' (got ' + JSON.stringify(a) + ', expected ' + JSON.stringify(b) + ')']); }
  };
}

function addRows(table, name, checks){
  const bad = checks.filter(c=>!c[0]);
  const tr = document.createElement('tr');
  tr.innerHTML = '<td class="n">' + (bad.length ? '<span class="fail">FAIL</span> ' : '<span class="pass">PASS</span> ') + name
    + '</td><td class="msg">' + (bad.length ? bad.map(c=>c[1]).join('<br>') : checks.length + ' checks') + '</td>';
  table.appendChild(tr);
  return bad.length === 0;
}

(async()=>{
  // The app autosaves into localStorage; keep the user's data intact while the iframes run.
  const KEYS = ['pl-code', 'pl-files', 'pl-theme'];
  const backup = {};
  KEYS.forEach(k=>{ backup[k] = localStorage.getItem(k); });

  const results = {passed:0, failed:0, details:[]};
  const tally = (ok, name)=>{ if(ok) results.passed++; else { results.failed++; results.details.push(name); } };

  try{
    await startWorker();
  }catch(e){
    $('summary').innerHTML = '<span class="fail">could not start Python: ' + e.message + '</span>';
    window.__results = {passed:0, failed:1, details:['startup']}; window.__done = true; return;
  }

  const includeSlow = new URLSearchParams(location.search).has('slow') || $('slow').checked;
  for(const c of CASES){
    if(c.slow && !includeSlow){ continue; }
    const t = mkT();
    try{
      const r = await runPy(c);
      c.check(r, t);
    }catch(e){
      t.ok(false, 'threw: ' + e.message);
    }
    tally(addRows($('cases'), c.name, t.checks), c.name);
  }

  // editor helpers: syntax check + formatter
  {
    const t = mkT();
    const NL = String.fromCharCode(10), TAB = String.fromCharCode(9);
    try{
      const ok = JSON.parse((await rpcCall('check', {code:'x = 1' + NL + 'print(x)'})).data);
      t.eq(ok, null, 'valid code has no syntax error');
      const bad = JSON.parse((await rpcCall('check', {code:'x = (' + NL})).data);
      t.ok(bad && bad.line === 1 && bad.msg.startsWith('SyntaxError'), 'unclosed bracket reported on line 1');
      const ind = JSON.parse((await rpcCall('check', {code:'if True:' + NL + 'print(1)' + NL})).data);
      t.ok(ind && ind.msg.indexOf('IndentationError') === 0, 'missing indent reported');
      const f = await rpcCall('format', {code:'x=1' + NL + NL + NL + NL + 'y   =   2'});
      t.ok(f.data.endsWith(NL), 'formatted code ends with a newline');
      t.ok(f.data.indexOf('x = 1') >= 0 || f.via === 'basic', 'autopep8 spaces operators (or basic fallback)');
      const tabbed = await rpcCall('format', {code:'if True:' + NL + TAB + 'print(1)   ' + NL});
      t.ok(tabbed.data.indexOf(TAB) < 0, 'tabs are expanded');
    }catch(e){ t.ok(false, 'threw: ' + e.message); }
    tally(addRows($('cases'), 'syntax check and formatter', t.checks), 'syntax check and formatter');
  }

  await runLayoutTests($('frames'), (name, checks)=>{
    tally(addRows($('layout'), name, checks), 'layout: ' + name);
  });

  KEYS.forEach(k=>{ if(backup[k] === null) localStorage.removeItem(k); else localStorage.setItem(k, backup[k]); });

  const total = results.passed + results.failed;
  $('summary').innerHTML = results.failed
    ? '<span class="fail">' + results.failed + ' failed</span>, ' + results.passed + ' passed (' + total + ')'
    : '<span class="pass">all ' + total + ' passed</span>';
  document.title = (results.failed ? 'FAIL ' : 'PASS ') + total;
  window.__results = results; window.__done = true;
})();
</script>
</body>
</html>
